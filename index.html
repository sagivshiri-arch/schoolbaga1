<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>מסדרים את התיק 🎒</title>
<meta name="description" content="עוזר לילד לדעת לבד מה לשים בתיק, לפי היום ומערכת השעות">
<meta property="og:title" content="מסדרים את התיק 🎒">
<meta property="og:description" content="עוזר לילד לדעת לבד מה לשים בתיק, לפי היום ומערכת השעות">
<meta property="og:image" content="https://firstgrade-a1.vercel.app/og-image.jpg">
<meta property="og:url" content="https://firstgrade-a1.vercel.app/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFC93C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#FFF8EC;
    --ink:#2B2440;
    --sun:#FFC93C;
    --sky:#8FD3F4;
    --grass:#7ED08A;
    --pink:#FF9EC7;
    --red:#E8543E;
    --red-soft:#FBDCD6;
    --blue:#2E7CD6;
    --blue-soft:#D8E9FB;
    --green:#2FA35E;
    --green-soft:#DCF3E4;
    --orange:#F08A2C;
    --orange-soft:#FCE7CF;
    --gray:#6B6579;
    --gray-soft:#EAE6F0;
    --yellow:#E8B23A;
    --yellow-soft:#FBEFCF;
    --purple:#8E6FCE;
    --purple-soft:#EAE2F9;
    --shadow: 0 6px 0 rgba(43,36,64,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Varela Round','Segoe UI',Arial,sans-serif;
    background: linear-gradient(180deg,#BFE6FB 0%, #E9F6FE 38%, var(--paper) 38%);
    color:var(--ink);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- Sky header ---------- */
  .sky{
    position:relative;
    height:150px;
    overflow:hidden;
  }
  .sun{
    position:absolute; top:-30px; right:-20px;
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #FFE08A, var(--sun));
    box-shadow:0 0 0 10px rgba(255,201,60,0.25);
  }
  .cloud{
    position:absolute; background:#fff; border-radius:50px;
    opacity:0.9;
  }
  .cloud1{width:120px;height:40px; top:20px; left:-20px;}
  .cloud1:before{content:'';position:absolute;width:60px;height:60px;background:#fff;border-radius:50%;top:-28px;left:15px;}
  .cloud2{width:80px;height:30px; top:70px; left:60px;}
  .title-bubble{
    position:relative; z-index:2; margin-top:14px;
    background:#fff; border-radius:26px; padding:14px 18px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  h1{margin:0; font-size:26px; line-height:1.3;}
  .sub{margin:4px 0 0; font-size:14px; color:#6B6579;}

  /* ---------- Day picker ---------- */
  .days{
    display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:22px;
  }
  .day-btn{
    border:none; cursor:pointer; border-radius:20px; padding:16px 10px;
    font-family:inherit; font-size:19px; font-weight:700; color:var(--ink);
    box-shadow:var(--shadow); text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition: transform .08s ease;
  }
  .day-btn:active{ transform: translateY(4px); box-shadow:0 2px 0 rgba(43,36,64,0.15);}
  .day-btn .letter{font-size:30px;}
  .day-btn .full{font-size:13px; font-weight:500; opacity:0.75;}

  .d-sun{background:var(--pink);}
  .d-mon{background:var(--yellow-soft); }
  .d-tue{background:var(--green-soft);}
  .d-wed{background:var(--sky);}
  .d-thu{background:var(--orange-soft);}
  .d-fri{background:#BFEFE0;}

  /* ---------- Day view ---------- */
  #dayView{display:none;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .back-btn{
    border:none; background:#fff; box-shadow:var(--shadow); border-radius:16px;
    padding:10px 16px; font-size:16px; font-weight:700; color:var(--ink); cursor:pointer;
  }
  .back-btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(43,36,64,0.15);}
  .day-heading{font-size:22px; font-weight:800; text-align:center; flex:1;}

  .section-label{
    font-size:15px; font-weight:700; color:#8b84a0; margin:22px 4px 10px;
  }

  /* period cards */
  .period{
    display:flex; gap:12px; align-items:flex-start;
    background:#fff; border-radius:18px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 3px 0 rgba(43,36,64,0.1);
    border-inline-start: 8px solid var(--gray);
  }
  .period.c-red{border-inline-start-color:var(--red); background:var(--red-soft);}
  .period.c-blue{border-inline-start-color:var(--blue); background:var(--blue-soft);}
  .period.c-green{border-inline-start-color:var(--green); background:var(--green-soft);}
  .period.c-orange{border-inline-start-color:var(--orange); background:var(--orange-soft);}
  .period.c-gray{border-inline-start-color:var(--gray); background:var(--gray-soft);}
  .period.c-yellow{border-inline-start-color:var(--yellow); background:var(--yellow-soft);}
  .period.c-purple{border-inline-start-color:var(--purple); background:var(--purple-soft);}
  .fixed-title{font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:2px;}

  .p-num{
    min-width:26px;height:26px;border-radius:50%;background:rgba(43,36,64,0.08);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
    margin-top:2px;
  }
  .p-body{flex:1;}
  .p-subject{font-size:17px; font-weight:800; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .p-subject .speak-btn.subject-speak{ width:30px; height:30px; font-size:14px; flex-shrink:0; }
  .p-time{font-size:13px; color:#7d7690; font-weight:700; margin-top:2px;}
  .p-none{font-size:13px; margin-top:6px; color:#8b84a0; font-style:normal;}

  .p-items{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .item-row-mini{
    display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.65);
    border-radius:12px; padding:7px 9px;
  }
  .item-row-mini .check{
    width:24px;height:24px;border-radius:7px;border:2px solid #C9C2DE; background:#fff;
    display:flex;align-items:center;justify-content:center; flex-shrink:0; cursor:pointer;
    font-size:15px; color:#fff;
  }
  .item-row-mini.checked .check{background:var(--grass); border-color:var(--grass);}
  .item-row-mini .item-text{flex:1; font-size:14.5px; line-height:1.4; cursor:pointer;}
  .item-row-mini.checked .item-text{text-decoration:line-through; color:#8b84a0;}
  .speak-btn{
    border:none; background:#fff; box-shadow:0 2px 0 rgba(43,36,64,0.12);
    width:32px;height:32px;border-radius:50%; font-size:15px; cursor:pointer;
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .speak-btn:active{transform:translateY(2px); box-shadow:none;}

  .break-row{
    text-align:center; font-size:13px; color:#7d92a8; margin:6px 0 14px;
    display:flex; align-items:center; gap:8px;
  }
  .break-row:before, .break-row:after{content:''; flex:1; height:1px; background:#d7e2ea;}

  /* backpack checklist */
  .bag-progress{
    height:10px; border-radius:6px; background:#EFEAF7; overflow:hidden; margin:4px 0 4px;
  }
  .bag-progress > div{height:100%; background:linear-gradient(90deg,var(--grass),#4CC98A); width:0%; transition:width .25s ease;}
  .progress-label{font-size:13px; color:#8b84a0; text-align:center; margin-bottom:2px;}

  .celebrate{
    display:none; text-align:center; margin-top:14px; margin-bottom:6px; font-size:16px; font-weight:800;
    color:#2FA35E; background:#E7F9EE; border-radius:16px; padding:14px;
  }
  .celebrate.show{display:block;}

  .reset-link{
    display:block; text-align:center; margin-top:14px; font-size:13px; color:#a39cb8;
    text-decoration:underline; background:none; border:none; cursor:pointer; width:100%;
  }

  .schedule-details{
    margin-top:20px; background:#fff; border-radius:18px; padding:4px 14px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .schedule-details summary{
    padding:12px 2px; font-size:16px; font-weight:700; cursor:pointer; list-style:none;
    display:flex; align-items:center; justify-content:space-between;
  }
  .schedule-details summary::-webkit-details-marker{display:none;}
  .schedule-details summary::after{content:'▾'; font-size:14px; color:#a39cb8;}
  .schedule-details[open] summary::after{content:'▴';}
  .schedule-img{
    width:100%; border-radius:12px; display:block; margin-bottom:12px;
  }

  .settings-btn{
    display:block; width:100%; margin-top:14px; padding:14px;
    background:#fff; border:none; border-radius:16px; box-shadow:var(--shadow);
    font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer;
  }
  .settings-btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(43,36,64,0.15);}

  .day-tabs{
    display:flex; gap:8px; margin:16px 0; justify-content:space-between;
  }
  .day-tab{
    flex:1; padding:10px 0; border:none; border-radius:12px; background:#EFEAF7;
    font-family:inherit; font-size:16px; font-weight:700; color:#8b84a0; cursor:pointer;
  }
  .day-tab.active{ background:var(--purple); color:#fff; }

  .activity-row{
    display:flex; align-items:flex-start; gap:10px; background:#fff; border-radius:16px;
    padding:12px 14px; margin-bottom:10px; box-shadow:0 3px 0 rgba(43,36,64,0.1);
    border-inline-start:8px solid var(--purple);
  }
  .activity-info{flex:1;}
  .activity-name{font-size:16px; font-weight:800;}
  .activity-items{font-size:13px; color:#7d7690; margin-top:3px;}
  .activity-del{
    border:none; background:none; font-size:18px; cursor:pointer; color:#c46a6a; flex-shrink:0;
  }
  .empty-note{ text-align:center; color:#a39cb8; font-size:14px; padding:10px 0 4px; }

  .add-form{
    background:#fff; border-radius:16px; padding:14px; box-shadow:var(--shadow); margin-top:6px;
  }
  .add-form input{
    width:100%; box-sizing:border-box; padding:11px 12px; margin-bottom:10px;
    border:2px solid #EFEAF7; border-radius:10px; font-family:inherit; font-size:15px;
  }
  .add-btn{
    width:100%; padding:12px; border:none; border-radius:12px; background:var(--purple);
    color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
  }
  .add-btn:active{ transform:translateY(2px); }

  .time-row{ display:flex; gap:10px; margin-bottom:10px; }
  .time-field{ flex:1; }
  .time-field label{ display:block; font-size:12px; color:#8b84a0; margin-bottom:4px; }
  .time-select-group{
    display:flex; align-items:center; gap:6px; direction:ltr;
  }
  .time-select-group select{
    flex:1; min-width:0; border:2px solid #D9CFF0; background:#F7F4FC;
    border-radius:10px; font-family:inherit; font-size:16px; font-weight:700;
    color:var(--ink); padding:11px 4px; text-align:center; text-align-last:center;
  }
  .time-colon{ font-weight:800; color:#8b84a0; font-size:16px; }

  .chip-input-row{ display:flex; gap:8px; align-items:center; }
  .chip-input-row input{ flex:1; margin-bottom:0; }
  .chip-add-btn{
    width:42px; height:42px; flex-shrink:0; border:none; border-radius:10px;
    background:var(--grass); color:#fff; font-size:20px; font-weight:800; cursor:pointer;
  }
  .chip-add-btn:active{ transform:translateY(2px); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--purple-soft);
    border-radius:20px; padding:6px 6px 6px 12px; font-size:13px; font-weight:700; color:var(--ink);
  }
  .chip button{
    border:none; background:#fff; color:#8b84a0; width:20px; height:20px; border-radius:50%;
    font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .activity-time{ font-size:12px; color:var(--purple); font-weight:700; margin-top:2px; }
</style>
</head>
<body>

<div class="wrap">

  <!-- HOME: day picker -->
  <div id="homeView">
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud cloud1"></div>

/* Word-level niqqud for free text parents type in (club names / extra items).
   Best-effort only — covers common words; anything not listed stays undotted. */
const WORD_NIQQUD = {
  'חוג':'חוּג', 'נעליים':'נַעֲלַיִם', 'נעלי':'נַעֲלֵי', 'ספורט':'סְפּוֹרְט',
  'כפפות':'כְּפָפוֹת', 'מגבת':'מַגֶּבֶת', 'בגד':'בֶּגֶד', 'ים':'יָם',
  'קסדה':'קַסְדָּה', 'מקל':'מַקֵּל', 'כדור':'כַּדּוּר', 'תיק':'תִּיק',
  'חולצה':'חֻלְצָה', 'מכנסיים':'מִכְנָסַיִם', 'גרביים':'גַּרְבַּיִם',
  'מגן':'מָגֵן', 'שיניים':'שִׁנַּיִם', 'משקפי':'מִשְׁקְפֵי', 'שחייה':'שְׂחִיָּה',
  'חליפת':'חֲלִיפַת', 'אוזניות':'אוֹזְנִיּוֹת', 'ספר':'סֵפֶר', 'עיפרון':'עִפָּרוֹן',
  'עפרונות':'עֶפְרוֹנוֹת', 'טוש':'טוּשׁ', 'טושים':'טוּשִׁים', 'דבק':'דֶּבֶק',
  'מספריים':'מִסְפָּרַיִם', 'צבעים':'צְבָעִים', 'מברשת':'מִבְרֶשֶׁת', 'כובע':'כּוֹבַע',
  'רצועה':'רְצוּעָה', 'כינור':'כִּנּוֹר', 'גיטרה':'גִּיטָרָה', 'חליל':'חָלִיל',
  'תופים':'תֻּפִּים', 'בקבוק':'בַּקְבּוּק', 'מים':'מַיִם', 'מחברת':'מַחְבֶּרֶת',
  'עליונה':'עֶלְיוֹנָה', 'לבנה':'לְבָנָה', 'שחורה':'שְׁחוֹרָה',
};

function vocalizeText(text){
  return text.split(' ').map(word=>{
    const bare = word.replace(/[.,:;!?]/g,'');
    return WORD_NIQQUD[bare] || word;
  }).join(' ');
}

function withNiqqud(it){
  if(NIQQUD[it]) return NIQQUD[it];
  return vocalizeText(it);
}

/* ---------- Custom activities (חוגים) — stored per-device via localStorage,
   so each parent keeps their own child's list without affecting others. ---------- */
const ACTIVITIES_KEY = 'customActivities';
function loadActivities(){
  try{ return JSON.parse(localStorage.getItem(ACTIVITIES_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveActivities(obj){
  localStorage.setItem(ACTIVITIES_KEY, JSON.stringify(obj));
}
function getActivitiesForDay(day){
  const all = loadActivities();
  return all[day] || [];
}

document.querySelectorAll('.day-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const dayName = btn.querySelector('.full').textContent;
    speak(toSpeechText(dayName));
    openDay(btn.dataset.day);
  });
});
document.getElementById('backBtn').addEventListener('click', ()=>{
  dayView.style.display='none';
  homeView.style.display='block';
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!currentDay) return;
  localStorage.removeItem('bag_'+currentDay);
  renderPeriods(SCHEDULE[currentDay].periods);
});

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  homeView.style.display='none';
  settingsView.style.display='block';
  window.scrollTo(0,0);
  openSettingsDay(settingsDay);
});
document.getElementById('settingsBackBtn').addEventListener('click', ()=>{
  settingsView.style.display='none';
  homeView.style.display='block';
});
document.querySelectorAll('.day-tab').forEach(btn=>{
  btn.addEventListener('click', ()=> openSettingsDay(btn.dataset.day));
});
document.getElementById('addActivityBtn').addEventListener('click', addActivity);
document.getElementById('addItemBtn').addEventListener('click', addPendingItem);
document.getElementById('itemInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); addPendingItem(); }
});

let pendingItems = [];

function renderChips(){
  const wrap = document.getElementById('itemChips');
  wrap.innerHTML = pendingItems.map((it, idx)=>
    `<span class="chip">${it}<button type="button" data-idx="${idx}">✕</button></span>`
  ).join('');
  wrap.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingItems.splice(parseInt(btn.dataset.idx), 1);
      renderChips();
    });
  });
}

function addPendingItem(){
  const input = document.getElementById('itemInput');
  const val = input.value.trim();
  if(!val) return;
  pendingItems.push(val);
  input.value = '';
  renderChips();
}

function openSettingsDay(day){
  settingsDay = day;
  document.querySelectorAll('.day-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.day === day);
  });
  renderActivitiesList();
}

function renderActivitiesList(){
  const list = getActivitiesForDay(settingsDay);
  activitiesList.innerHTML = '';
  if(list.length === 0){
    activitiesList.innerHTML = '<div class="empty-note">אין עדיין חוגים ליום הזה</div>';
    return;
  }
  list.forEach((act, idx)=>{
    const row = document.createElement('div');
    row.className = 'activity-row';
    const timeStr = (act.start && act.end) ? `🕐 <span dir="ltr" style="unicode-bidi:embed;">${act.start}\u2013${act.end}</span>` : '';
    row.innerHTML = `
      <div class="activity-info">
        <div class="activity-name">${act.name}</div>
        ${timeStr ? `<div class="activity-time">${timeStr}</div>` : ''}
        ${act.items && act.items.length ? `<div class="activity-items">${act.items.join(', ')}</div>` : ''}
      </div>
      <button class="activity-del" data-idx="${idx}">🗑️</button>`;
    activitiesList.appendChild(row);
  });
  activitiesList.querySelectorAll('.activity-del').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteActivity(parseInt(btn.dataset.idx)));
  });
}

function populateTimeSelects(){
  const hourSelects = ['startHour','endHour'];
  const minSelects = ['startMin','endMin'];
  hourSelects.forEach(id=>{
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">--</option>' +
      Array.from({length:24}, (_,h)=>{
        const v = String(h).padStart(2,'0');
        return `<option value="${v}">${v}</option>`;
      }).join('');
  });
  minSelects.forEach(id=>{
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">--</option>' +
      ['00','15','30','45'].map(m=>`<option value="${m}">${m}</option>`).join('');
  });
}
populateTimeSelects();

function readTime(hourId, minId){
  const h = document.getElementById(hourId).value;
  const m = document.getElementById(minId).value;
  if(!h || !m) return '';
  return `${h}:${m}`;
}

function resetTimeSelects(){
  ['startHour','startMin','endHour','endMin'].forEach(id=>{
    document.getElementById(id).value = '';
  });
}

function addActivity(){
  const nameInput = document.getElementById('activityName');
  const name = nameInput.value.trim();
  if(!name) return;
  const start = readTime('startHour','startMin');
  const end = readTime('endHour','endMin');
  const all = loadActivities();
  if(!all[settingsDay]) all[settingsDay] = [];
  all[settingsDay].push({
    name,
    start,
    end,
    items: pendingItems.slice()
  });
  saveActivities(all);
  nameInput.value = '';
  resetTimeSelects();
  pendingItems = [];
  renderChips();
  renderActivitiesList();
}

function deleteActivity(idx){
  const all = loadActivities();
  if(!all[settingsDay]) return;
  all[settingsDay].splice(idx, 1);
  saveActivities(all);
  renderActivitiesList();
}

function openDay(day){
  currentDay = day;
  const data = SCHEDULE[day];
  dayHeading.textContent = data.name;
  renderPeriods(data.periods);
  homeView.style.display='none';
  dayView.style.display='block';
  window.scrollTo(0,0);
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const synth = window.speechSynthesis;
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
  synth.cancel();
  setTimeout(()=>{
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'he-IL';
    u.rate = 0.9;
    const voices = synth.getVoices();
    const heVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('he'));
    if(heVoice) u.voice = heVoice;
    synth.speak(u);
  }, 60);
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
  window.speechSynthesis.getVoices();
}

function toSpeechText(it){
  // Vowel-pointed text (see NIQQUD above) both displays as reading practice for
  // a 1st-grader and gives the speech engine the correct pronunciation.
  return withNiqqud(it);
}

function itemRowHtml(it, saved){
  const isChecked = !!saved[it];
  const safe = it.replace(/"/g,'&quot;');
  const display = withNiqqud(it);
  const spoken = toSpeechText(it).replace(/"/g,'&quot;');
  return `<div class="item-row-mini${isChecked?' checked':''}" data-key="${safe}">
            <div class="check">${isChecked?'✓':''}</div>
            <div class="item-text">${display}</div>
            <button class="speak-btn" data-say="${spoken}">🔊</button>
          </div>`;
}

function subjectHtml(name, icon){
  const display = withNiqqud(name);
  const spoken = toSpeechText(name).replace(/"/g,'&quot;');
  return `<div class="p-subject">
            <span>${icon ? icon + ' ' : ''}${display}</span>
            <button class="speak-btn subject-speak" data-say="${spoken}">🔊</button>
          </div>`;
}

function wireItemRows(container){
  container.querySelectorAll('.item-row-mini').forEach(row=>{
    row.querySelector('.check').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleItem(row.dataset.key);
    });
    row.querySelector('.item-text').addEventListener('click', ()=>{
      toggleItem(row.dataset.key);
    });
  });
  container.querySelectorAll('.speak-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      speak(btn.dataset.say);
    });
  });
}

function renderFixed(saved){
  const div = document.createElement('div');
  div.className = 'period c-purple';
  div.innerHTML = `
    <div class="p-num">🎒</div>
    <div class="p-body">
      <div class="fixed-title">קבוע בתיק</div>
      <div class="p-items">${DAILY_FIXED.map(it=>itemRowHtml(it, saved)).join('')}</div>
    </div>`;
  fixedList.innerHTML = '';
  fixedList.appendChild(div);
  wireItemRows(fixedList);
}

function renderCustom(saved){
  const acts = getActivitiesForDay(currentDay);
  if(!acts.length){
    customSection.style.display = 'none';
    customList.innerHTML = '';
    return;
  }
  customSection.style.display = 'block';
  customList.innerHTML = '';
  acts.forEach(act=>{
    const div = document.createElement('div');
    div.className = 'period c-purple';
    const timeStr = (act.start && act.end) ? `🕐 <span dir="ltr" style="unicode-bidi:embed;">${act.start}\u2013${act.end}</span>` : '';
    let itemsHtml = '';
    if(act.items && act.items.length){
      itemsHtml = '<div class="p-items">' + act.items.map(it=>itemRowHtml(it, saved)).join('') + '</div>';
    } else {
      itemsHtml = `<div class="p-none">אין צורך בציוד מיוחד</div>`;
    }
    div.innerHTML = `
      <div class="p-num">⭐</div>
      <div class="p-body">
        ${subjectHtml(act.name)}
        ${timeStr ? `<div class="p-time">${timeStr}</div>` : ''}
        ${itemsHtml}
      </div>`;
    customList.appendChild(div);
  });
  wireItemRows(customList);
}

function renderPeriods(periods){
  const saved = JSON.parse(localStorage.getItem('bag_'+currentDay) || '{}');
  periodsList.innerHTML='';
  let num=0;

  renderFixed(saved);
  renderCustom(saved);

  periods.forEach((p)=>{
    if(p==='break'){
      const div=document.createElement('div');
      div.className='break-row';
      div.textContent='הפסקה ⏰';
      periodsList.appendChild(div);
      return;
    }
    num++;
    const eq = EQUIP[p.subject] || {color:'gray',icon:'📌',items:[]};
    const div=document.createElement('div');
    div.className='period c-'+eq.color;

    let itemsHtml = '';
    if(eq.items.length){
      itemsHtml = '<div class="p-items">' + eq.items.map(it=>itemRowHtml(it, saved)).join('') + '</div>';
    } else {
      itemsHtml = `<div class="p-none">אין צורך בציוד מיוחד</div>`;
    }

    div.innerHTML = `
      <div class="p-num">${num}</div>
      <div class="p-body">
        ${subjectHtml(p.subject, eq.icon)}
        ${itemsHtml}
      </div>`;
    periodsList.appendChild(div);
  });

  wireItemRows(periodsList);
  updateProgress(periods, saved);
}

function toggleItem(key){
  const cur = JSON.parse(localStorage.getItem('bag_'+currentDay) || '{}');
  cur[key] = !cur[key];
  localStorage.setItem('bag_'+currentDay, JSON.stringify(cur));
  renderPeriods(SCHEDULE[currentDay].periods);
}

function updateProgress(periods, saved){
  const uniqueItems = new Set(DAILY_FIXED);
  periods.forEach(p=>{
    if(p==='break') return;
    const eq = EQUIP[p.subject] || {items:[]};
    eq.items.forEach(it=> uniqueItems.add(it));
  });
  getActivitiesForDay(currentDay).forEach(act=>{
    (act.items || []).forEach(it=> uniqueItems.add(it));
  });
  const total = uniqueItems.size;
  let done=0;
  uniqueItems.forEach(it=>{ if(saved[it]) done++; });

  const pct = total ? Math.round(done/total*100) : 100;
  bagBar.style.width = pct+'%';
  progressLabel.textContent = `${done} מתוך ${total} בתיק`;
  if(total>0 && done===total){
    celebrate.classList.add('show');
  } else {
    celebrate.classList.remove('show');
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
